# NVEncC option page (rigaya). Anvil sets codec, preset, quality, depth,
# colour, HDR and Dolby Vision. Checked against NVEncC_Options.en.md.
encoder = "nvencc"
program = "NVEncC"
help_args = ["--help"]

[[option]]
flag = "--multipass"
label = "Multipass"
group = "Quality"
kind = "choice"
choices = ["none", "2pass-quarter", "2pass-full"]
default = "none"
help = "Full is slower and more accurate."

[[option]]
flag = "--aq"
label = "Spatial AQ"
group = "Quality"
kind = "flag"
default = "off"
help = "Moves bits towards flat areas."

[[option]]
flag = "--aq-temporal"
label = "Temporal AQ"
group = "Quality"
kind = "flag"
default = "off"
help = "Moves bits towards static detail."

[[option]]
flag = "--aq-strength"
label = "AQ strength"
group = "Quality"
kind = "int"
min = 0
max = 15
default = "0"
help = "0 is automatic."

[[option]]
flag = "--lookahead"
label = "Lookahead frames"
group = "Frames"
kind = "int"
min = 0
max = 32
default = "0"
help = "Better frame decisions; 16 to 32 suits films."

[[option]]
flag = "--lookahead-level"
label = "Lookahead level (HEVC)"
group = "Frames"
kind = "choice"
choices = ["0", "1", "2", "3", "auto"]
default = "0"
help = "Needs lookahead; newer GPUs."

[[option]]
flag = "--bframes"
label = "B-frames"
group = "Frames"
kind = "int"
min = 0
max = 7
default = "auto"
help = "Consecutive B-frames."

[[option]]
flag = "--bref-mode"
label = "B-frames as references"
group = "Frames"
kind = "choice"
choices = ["auto", "disabled", "each", "middle"]
default = "auto"
help = "Middle or each usually helps quality."

[[option]]
flag = "--ref"
label = "Reference frames"
group = "Frames"
kind = "int"
min = 0
max = 16
default = "auto"
help = "Frames each frame may predict from."

[[option]]
flag = "--gop-len"
label = "GOP length"
group = "Frames"
kind = "int"
min = 0
max = 1000
default = "auto"
help = "Longest gap between keyframes."

[[option]]
flag = "--max-bitrate"
label = "Max bitrate (kb/s)"
group = "Compatibility"
kind = "int"
min = 0
max = 800000
default = "auto"
help = "Peak limit for players."

[[option]]
flag = "--vbv-bufsize"
label = "Buffer size (kb)"
group = "Compatibility"
kind = "int"
min = 0
max = 800000
default = "auto"
help = "Decoder buffer size."

[[option]]
flag = "--split-enc"
label = "Split-frame encoding"
group = "Performance"
kind = "choice"
choices = ["auto", "disable", "forced_2", "forced_3"]
default = "auto"
help = "Uses several encoder engines on one frame (big GPUs)."
